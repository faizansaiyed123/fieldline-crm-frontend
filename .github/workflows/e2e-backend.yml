name: Frontend + Backend E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fieldline-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fieldline
          POSTGRES_USER: fieldline
          POSTGRES_PASSWORD: fieldline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fieldline -d fieldline"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      FIELDLINE_DATABASE_URL: postgresql+psycopg://fieldline:fieldline@localhost:5432/fieldline
      FIELDLINE_JWT_SECRET_KEY: e2e-only-secret-key-that-is-at-least-32-bytes-long
      BACKEND_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/fieldline-crm-backend
          path: fieldline-crm-backend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fieldline-crm-backend/pyproject.toml

      - name: Install backend
        working-directory: fieldline-crm-backend
        run: python -m pip install ".[dev]"

      - name: Apply backend migrations
        working-directory: fieldline-crm-backend
        run: python -m alembic upgrade head

      - name: Start backend
        working-directory: fieldline-crm-backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/fieldline-backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/ && exit 0
            sleep 1
          done
          cat /tmp/fieldline-backend.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run real browser E2E
        run: npx playwright test e2e/real-backend.spec.ts e2e/deep-product.spec.ts e2e/full-feature-coverage.spec.ts e2e/standout.spec.ts e2e/smoke.spec.ts

      - name: Publish walkthrough screenshots
        if: success()
        run: |
          mkdir -p docs/visuals
          cp test-results/walkthrough/*.png docs/visuals/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visuals/*.png
          if git diff --cached --quiet; then
            echo "Walkthrough screenshots are unchanged."
            exit 0
          fi
          git commit -m "Refresh Fieldline walkthrough images"
          git push origin HEAD:main

      - name: Preserve walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldline-product-walkthrough
          path: test-results/walkthrough/*.png
          if-no-files-found: warn
          retention-days: 14
