name: Frontend + Backend E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fieldline
          POSTGRES_USER: fieldline
          POSTGRES_PASSWORD: fieldline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fieldline -d fieldline"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      FIELDLINE_DATABASE_URL: postgresql+psycopg://fieldline:fieldline@localhost:5432/fieldline
      FIELDLINE_JWT_SECRET_KEY: e2e-only-secret-key-that-is-at-least-32-bytes-long
      BACKEND_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/fieldline-crm-backend
          path: fieldline-crm-backend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fieldline-crm-backend/pyproject.toml

      - name: Install backend
        working-directory: fieldline-crm-backend
        run: python -m pip install ".[dev]"

      - name: Apply backend migrations
        working-directory: fieldline-crm-backend
        run: python -m alembic upgrade head

      - name: Start backend
        working-directory: fieldline-crm-backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/fieldline-backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/ && exit 0
            sleep 1
          done
          cat /tmp/fieldline-backend.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real browser E2E
        run: npx playwright test e2e/real-backend.spec.ts e2e/standout.spec.ts
