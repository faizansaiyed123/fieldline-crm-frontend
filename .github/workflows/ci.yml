name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend
        run: npm install

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npx playwright test e2e/smoke.spec.ts e2e/standout.spec.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/fieldline-crm-backend
          ref: feat/startup-docker-support
          path: backend

      - name: Validate frontend Compose configuration
        run: docker compose config

      - name: Validate backend Compose configuration
        working-directory: backend
        run: docker compose config

      - name: Build backend image
        working-directory: backend
        run: docker compose build

      - name: Start backend stack
        working-directory: backend
        run: docker compose up -d

      - name: Wait for backend readiness
        working-directory: backend
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/tmp/fieldline-backend-ready.json; then
              cat /tmp/fieldline-backend-ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Build frontend image
        run: docker compose build

      - name: Start frontend
        run: docker compose up -d

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/tmp/fieldline-frontend.html; then
              head -c 200 /tmp/fieldline-frontend.html
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify frontend API rewrite
        run: curl --fail --silent http://127.0.0.1:3000/api/v1/health

      - name: Stop frontend
        if: always()
        run: docker compose down -v

      - name: Stop backend
        if: always()
        working-directory: backend
        run: docker compose down -v
