name: Restore frontend ZIP overlay

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate the ZIP overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fieldline
          cat .restore/frontend-overlay-000 .restore/frontend-overlay-001 > /tmp/fieldline/overlay.b64
          base64 --decode /tmp/fieldline/overlay.b64 > /tmp/fieldline/overlay.txz
          xz --test /tmp/fieldline/overlay.txz
          tar -tJf /tmp/fieldline/overlay.txz > /tmp/fieldline/manifest.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)\.git(/|$))' /tmp/fieldline/manifest.txt; then
            echo "Unsafe path found in overlay archive."
            exit 1
          fi
          echo "Validated overlay members:"
          sed -n '1,120p' /tmp/fieldline/manifest.txt
          tar --no-same-owner -xJf /tmp/fieldline/overlay.txz -C .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install frontend from lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: npx playwright test e2e/smoke.spec.ts e2e/standout.spec.ts

      - name: Clean up overlay and commit restored source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .restore .github/workflows/restore-frontend-overlay.yml /tmp/fieldline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Overlay extraction made no source changes."
            exit 0
          fi
          git commit -m "chore: apply frontend ZIP updates"
          git push
