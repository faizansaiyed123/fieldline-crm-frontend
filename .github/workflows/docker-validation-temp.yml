name: Docker Validation (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/fieldline-crm-backend
          ref: feat/startup-docker-support
          path: backend

      - name: Validate frontend Compose configuration
        run: docker compose config

      - name: Validate backend Compose configuration
        working-directory: backend
        run: docker compose config

      - name: Build backend image
        working-directory: backend
        run: docker compose build

      - name: Start backend stack
        working-directory: backend
        run: docker compose up -d

      - name: Wait for backend readiness
        working-directory: backend
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/tmp/backend-ready.json; then
              cat /tmp/backend-ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Build frontend image
        run: docker compose build

      - name: Start frontend
        run: docker compose up -d

      - name: Verify frontend root
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/tmp/frontend.html; then
              head -c 200 /tmp/frontend.html
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify frontend API rewrite reaches backend
        run: curl --fail --silent http://127.0.0.1:3000/api/v1/health

      - name: Stop frontend
        if: always()
        run: docker compose down -v

      - name: Stop backend
        if: always()
        working-directory: backend
        run: docker compose down -v
