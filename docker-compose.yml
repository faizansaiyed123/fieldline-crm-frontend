services:
  web:
    build:
      context: .
      args:
        BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
